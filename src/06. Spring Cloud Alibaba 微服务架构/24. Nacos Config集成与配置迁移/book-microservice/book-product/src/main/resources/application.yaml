spring:
  application:
    name: book-product
  config:
    import: optional:nacos:book-product.yml    # 从Nacos导入配置
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: dev
        file-extension: yml                     # DataId后缀为yml
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: dev
        group: DEFAULT_GROUP


# 业务自定义配置（用于后续动态刷新验证）
book:
  product:
    page-size: 30
    cache-enabled: true