name: deal-pilot-neo4j

services:
  neo4j:
    image: neo4j:2026.10.1-enterprise
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474" # Neo4j Browser 和 Bloom
      - "127.0.0.1:7687:7687" # Bolt
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "${NEO4J_ACCEPT_LICENSE_AGREEMENT:?Accept the Neo4j Enterprise license before starting}"
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set the initial Neo4j password (at least 8 characters)}"
      NEO4J_PLUGINS: '["bloom"]'
      NEO4J_dbms_bloom_license__file: /licenses/bloom.license
      NEO4J_dbms_security_procedures_unrestricted: "bloom.*"
      NEO4J_server_unmanaged__extension__classes: "com.neo4j.bloom.server=/bloom"
      NEO4J_dbms_security_http__auth__allowlist: "/,/browser.*,/bloom.*"
    volumes:
      - neo4j_data:/data
      - type: bind
        source: "${BLOOM_LICENSE_FILE:?Set the path to your Bloom server license file}"
        target: /licenses/bloom.license
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -a bolt://localhost:7687 -u neo4j -p "$${NEO4J_AUTH#neo4j/}" --format plain
          "SHOW PROCEDURES YIELD name WHERE name STARTS WITH 'bloom.' RETURN name LIMIT 1"
          | grep -F 'bloom.'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  neo4j_data:
