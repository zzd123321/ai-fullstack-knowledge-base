spring:
  application:
    name: book-manager

---

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/bookdb2
    username: postgres
    password: admin
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

# MyBatis 配置
mybatis:
  # XML 映射文件位置（默认 classpath*:mapper/**/*.xml）
  mapper-locations: classpath:mapper/*.xml
  # 实体类包路径（用于简化 resultType 写法）
  type-aliases-package: com.example.bookmanager.model
  configuration:
    # 下划线转驼峰（如 created_at → createdAt）
    map-underscore-to-camel-case: true
    # 开启控制台 SQL 日志（开发环境）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启二级缓存
    cache-enabled: true

pagehelper:
  helper-dialect: postgresql      # 数据库方言
  reasonable: true                # 分页合理化（pageNum <= 0 自动取第一页）
  support-methods-arguments: true # 支持通过 Mapper 方法参数传递分页参数
  params: count=countSql